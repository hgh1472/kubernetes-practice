replicaCounts: 3

image:
 repository: nginx
 tag: "1.24"
 pullPolicy: IfNotPresent

serviceAccount:
 create: true
 annotations: {}
 name: ""

service:
 type: ClusterIP
 port: 80

ingress:
 enabled: true
 className: nginx
 hosts:
   - host: myapp.local
    paths:
      - path: /
        pathType: Prefix

resources:
 requests:
   memory: "64Mi"
   cpu: "100m"
 limits:
   memory: "128Mi"
   cpu: "200m"

livenessProbe:
 httpGet:
   path: /
   port: http
 initialDelaySeconds: 10
 periodSeconds: 10

readinessProbe:
 httpGet:
   path: /
   port: http
 initialDelaySeconds: 5
 periodSeconds: 5

autoscaling:
 enabled: false

nodeSelector: {}

tolerations: []

affinity: {}

seviceAccount:
 create: false
 name: ""
